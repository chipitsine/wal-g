name: Docker tests

on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
    inputs:
      pg_versions:
        description: 'Space-separated PostgreSQL majors to test; empty = all supported'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  # Run the whole test suite once for each PostgreSQL version. The versions and
  # the slices of each suite run at the same time, so more versions cost more
  # machine time but almost no extra waiting. A manual run can test fewer
  # versions, see pg_versions above.
  prepare:
    name: resolve versions
    runs-on: ubuntu-latest
    outputs:
      pg_commands: ${{ steps.resolve.outputs.pg_commands }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build the command list
        id: resolve
        env:
          # empty on push and pull_request, and whenever a manual run leaves it
          # blank. Not named PG_VERSIONS: make treats an empty environment
          # variable as set, and ?= in the Makefile would not override it.
          INPUT_PG_VERSIONS: ${{ inputs.pg_versions }}
          # The suite is one long sequential script, so it is cut into this
          # many slices that run as separate jobs, plus one job for the tests
          # that need extra containers. See PG_TEST_SHARD in the Makefile.
          PG_TEST_SHARDS: 4
        run: |
          # the Makefile owns the list of supported versions
          versions="${INPUT_PG_VERSIONS:-$(make -s print_pg_versions)}"
          if [ -z "$versions" ]; then
            echo "empty version list; is print_pg_versions still in the Makefile?" >&2
            exit 1
          fi

          pg=$(for v in $versions; do
            for s in $(seq 1 "$PG_TEST_SHARDS"); do
              printf '"make PG_MAJOR=%s PG_TEST_SHARD=%s/%s pg_integration_test",' "$v" "$s" "$PG_TEST_SHARDS"
            done
            printf '"make PG_MAJOR=%s PG_TEST_SHARD=extras pg_integration_test",' "$v"
          done)

          pg_commands="[${pg%,}]"

          echo "pg_commands=$pg_commands" >> "$GITHUB_OUTPUT"
          echo "PostgreSQL: $versions"

  pg_integration_test:
    name: PostgreSQL integration tests
    needs: prepare
    uses: ./.github/workflows/dockertests.yml
    with:
      command-json-array: ${{ needs.prepare.outputs.pg_commands }}
