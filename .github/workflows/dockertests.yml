name: Docker tests

on:
  workflow_call:
    inputs:
      base-command-json-array:
        required: false
        type: string
        default: '[]'
      pg10-command-json-array:
        required: false
        type: string
        default: '[]'

env:
  CACHE_FOLDER: ~/docker-images-${{ github.sha }}
  CACHE_FILE_UBUNTU_18_04: ~/docker-images-${{ github.sha }}/wal-g_ubuntu-18.04.tar
  CACHE_FILE_UBUNTU_22_04: ~/docker-images-${{ github.sha }}/wal-g_ubuntu-22.04.tar
  CACHE_FILE_GOLANG: ~/docker-images-${{ github.sha }}/wal-g_golang.tar
  CACHE_FILE_PG10_TESTS: ~/docker-images-${{ github.sha }}/pg10_tests.tar
  CACHE_FILE_PG18_TESTS: ~/docker-images-${{ github.sha }}/pg18_tests.tar
  IMAGE_PG10_TESTS: wal-g/pg10_tests
  IMAGE_PG18_TESTS: wal-g/pg18_tests
  IMAGE_GOLANG: wal-g/golang
  IMAGES_CACHE_KEY_BASE: docker-images-base-${{ github.sha }}
  IMAGES_CACHE_KEY_PG10: docker-images-pg10-${{ github.sha }}
  GO_VERSION: "1.25"

jobs:
  buildimages_base:
    name: Build base images
    runs-on: ubuntu-latest
    steps:
      - name: Docker images caching
        id: cache-images
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CACHE_FILE_PG18_TESTS }}
            ${{ env.CACHE_FILE_UBUNTU_18_04 }}
            ${{ env.CACHE_FILE_UBUNTU_22_04 }}
            ${{ env.CACHE_FILE_GOLANG }}
          key: ${{ env.IMAGES_CACHE_KEY_BASE }}

      - name: Cleanup space on runner
        run: |
          swapon --show=NAME --noheadings | while read swap_device; do
            sudo swapoff $swap_device
          done
  
          if [ -e /swapfile ]; then
            sudo rm /swapfile
          fi

      - name: Install deps
        if: steps.cache-images.outputs.cache-hit != 'true'
        run: sudo apt clean && sudo apt-get install liblzo2-dev

      - name: Check out code into the Go module directory
        if: steps.cache-images.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Go 1.x
        if: steps.cache-images.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Set up Docker Buildx
        if: steps.cache-images.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build images
        if: steps.cache-images.outputs.cache-hit != 'true'
        run: make pg_save_base_images
    env:
      USE_BROTLI: 1
      USE_LZO: 1
      COMPOSE_BAKE: "true"
      COMPOSE_FILE: docker-compose.yml:docker-compose.bake.yml

  buildimages_pg10:
    name: Build pg10 images
    runs-on: ubuntu-latest
    steps:
      - name: Docker images caching
        id: cache-images
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CACHE_FILE_PG10_TESTS }}
          key: ${{ env.IMAGES_CACHE_KEY_PG10 }}

      - name: Cleanup space on runner
        run: |
          swapon --show=NAME --noheadings | while read swap_device; do
            sudo swapoff $swap_device
          done
  
          if [ -e /swapfile ]; then
            sudo rm /swapfile
          fi

      - name: Install deps
        if: steps.cache-images.outputs.cache-hit != 'true'
        run: sudo apt clean && sudo apt-get install liblzo2-dev

      - name: Check out code into the Go module directory
        if: steps.cache-images.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Go 1.x
        if: steps.cache-images.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Set up Docker Buildx
        if: steps.cache-images.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build images
        if: steps.cache-images.outputs.cache-hit != 'true'
        run: make pg_save_pg10_image
    env:
      USE_BROTLI: 1
      USE_LZO: 1
      COMPOSE_BAKE: "true"
      COMPOSE_FILE: docker-compose.yml:docker-compose.bake.yml

  test_base:
    name: test base
    runs-on: ubuntu-latest
    needs: [ buildimages_base ]
    if: inputs.base-command-json-array != '[]' && inputs.base-command-json-array != ''
    strategy:
      matrix:
        command: ${{ fromJSON(inputs.base-command-json-array) }}
      fail-fast: false
    steps:
      - name: Install deps
        run: sudo apt-get install liblzo2-dev

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Load base docker images
        id: cache-images-base
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CACHE_FILE_PG18_TESTS }}
            ${{ env.CACHE_FILE_UBUNTU_18_04 }}
            ${{ env.CACHE_FILE_UBUNTU_22_04 }}
            ${{ env.CACHE_FILE_GOLANG }}
          key: ${{ env.IMAGES_CACHE_KEY_BASE }}

      - name: Fail if no cached images
        if: steps.cache-images-base.outputs.cache-hit != 'true'
        run: |
          echo "Failed to fetch cached docker images. Will now exit..."
          exit 1

      - name: Run test
        run: ${{ matrix.command }}

      - name: Collect container logs
        if: always()
        run: |
          set +e
          mkdir -p container-logs
          containers=$(docker ps -a --filter 'name=wal-g_' --filter 'name=test_net_' --format '{{.Names}}')
          for c in $containers; do
            mkdir -p "container-logs/$c"
            docker logs "$c" >"container-logs/$c/stdout.log" 2>"container-logs/$c/stderr.log"
            docker cp "$c:/var/log" "container-logs/$c/var-log" 2>/dev/null
          done
          ls -R container-logs || true

      - name: Sanitize artifact name
        if: always()
        id: artifact
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          slug=$(printf '%s' "$COMMAND" | tr -c 'A-Za-z0-9._-' '_')
          echo "slug=$slug" >>"$GITHUB_OUTPUT"

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ steps.artifact.outputs.slug }}
          path: container-logs
          if-no-files-found: ignore
          retention-days: 14
    env:
      USE_BROTLI: 1
      USE_LIBSODIUM: 1
      USE_LZO: 1

  test_pg10:
    name: test pg10
    runs-on: ubuntu-latest
    needs: [ buildimages_base, buildimages_pg10 ]
    if: inputs.pg10-command-json-array != '[]' && inputs.pg10-command-json-array != ''
    strategy:
      matrix:
        command: ${{ fromJSON(inputs.pg10-command-json-array) }}
      fail-fast: false
    steps:
      - name: Install deps
        run: sudo apt-get install liblzo2-dev

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Load base docker images
        id: cache-images-base
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CACHE_FILE_PG18_TESTS }}
            ${{ env.CACHE_FILE_UBUNTU_18_04 }}
            ${{ env.CACHE_FILE_UBUNTU_22_04 }}
            ${{ env.CACHE_FILE_GOLANG }}
          key: ${{ env.IMAGES_CACHE_KEY_BASE }}

      - name: Load pg10 docker images
        id: cache-images-pg10
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CACHE_FILE_PG10_TESTS }}
          key: ${{ env.IMAGES_CACHE_KEY_PG10 }}

      - name: Fail if no cached images
        if: steps.cache-images-base.outputs.cache-hit != 'true' || steps.cache-images-pg10.outputs.cache-hit != 'true'
        run: |
          echo "Failed to fetch cached docker images. Will now exit..."
          exit 1

      - name: Run test
        run: ${{ matrix.command }}

      - name: Collect container logs
        if: always()
        run: |
          set +e
          mkdir -p container-logs
          containers=$(docker ps -a --filter 'name=wal-g_' --filter 'name=test_net_' --format '{{.Names}}')
          for c in $containers; do
            mkdir -p "container-logs/$c"
            docker logs "$c" >"container-logs/$c/stdout.log" 2>"container-logs/$c/stderr.log"
            docker cp "$c:/var/log" "container-logs/$c/var-log" 2>/dev/null
          done
          ls -R container-logs || true

      - name: Sanitize artifact name
        if: always()
        id: artifact
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          slug=$(printf '%s' "$COMMAND" | tr -c 'A-Za-z0-9._-' '_')
          echo "slug=$slug" >>"$GITHUB_OUTPUT"

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ steps.artifact.outputs.slug }}
          path: container-logs
          if-no-files-found: ignore
          retention-days: 14
    env:
      USE_BROTLI: 1
      USE_LIBSODIUM: 1
      USE_LZO: 1
